name: Continuous Integration - Drilling Engine

# 1. ¿Cuándo se ejecuta esto?
on:
  push:
    branches: [ "main" ] # Se ejecuta cada vez que subes código a la rama main
  pull_request:
    branches: [ "main" ] # Se ejecuta si alguien propone un cambio a tu código

# 2. ¿Qué va a hacer?
jobs:
  build-and-test:
    # Levanta un servidor virtual con la última versión de Ubuntu (Linux)
    runs-on: ubuntu-latest

    steps:
    # Paso A: Clona tu repositorio dentro del servidor virtual
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Paso B: Instala Python (asumo 3.10, ajusta si usaste otra versión)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Acelera las ejecuciones futuras guardando las librerías

    # Paso C: Instala tu motor matemático y librerías
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest  # Aseguramos que pytest esté instalado para la prueba

    # Paso D: Ejecuta tu blindaje. Aquí es donde validas contra el Golden Dataset de Equinor
    - name: Run Pytest
      run: |
        pytest tests/ -v
        